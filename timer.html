<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таймер</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#17171a;color:#f4f4f5;font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.12),transparent 55%);animation:br 6s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.6px);background-size:14px 14px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 50% 45%,#000,transparent 70%)}
@keyframes br{to{opacity:.55}}
main{position:relative;z-index:1;text-align:center;padding:20px;width:100%}
#t{display:flex;justify-content:center;gap:clamp(8px,2.2vw,26px);flex-wrap:wrap}
.u{min-width:clamp(78px,17vw,190px);padding:clamp(14px,3vw,34px) 10px;border:1px solid #3a3a40;border-radius:22px;background:linear-gradient(160deg,#2a2a2f,#1d1d21);box-shadow:0 0 60px -20px rgba(255,255,255,.35)}
.u b{display:block;font-weight:700;font-size:clamp(40px,10vw,120px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 28px rgba(255,255,255,.55)}
.u span{display:block;margin-top:10px;color:#9d9da3;font-size:clamp(12px,1.6vw,18px)}
.u.s b{animation:p 1s ease-out infinite}
@keyframes p{0%{text-shadow:0 0 44px #fff}100%{text-shadow:0 0 28px rgba(255,255,255,.55)}}
.bar{height:4px;max-width:760px;margin:clamp(24px,5vw,48px) auto 0;border-radius:4px;background:#2c2c31;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a8a92,#fff);box-shadow:0 0 14px #fff}
.done{font-size:clamp(34px,8vw,90px);font-weight:700;text-shadow:0 0 30px rgba(255,255,255,.6)}
.lg{display:block;width:min(520px,78vw);margin:0 auto clamp(4px,2vw,20px);filter:drop-shadow(0 0 10px rgba(255,255,255,.28)) drop-shadow(0 0 40px rgba(255,255,255,.16)) drop-shadow(0 0 90px rgba(255,255,255,.1));animation:lgp 5s ease-in-out infinite}
@keyframes lgp{50%{opacity:.82}}
@media(max-height:620px){.lg{width:min(300px,50vw)}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important}}
</style>
</head>

<script>
/* Отсчёт стартует в момент загрузки сайта на сервер: берётся дата файла на сервере (Last-Modified),
   к ней прибавляется 20 дней. У всех посетителей одно и то же время, при перезаходе таймер просто идёт дальше.
   Чтобы зафиксировать старт навсегда (и не сбрасывать при повторной загрузке файла), впиши дату сюда,
   например "2026-11-01T12:00:00+03:00". */
const FIXED_START="";
let S=FIXED_START?Date.parse(FIXED_START):Date.parse(document.lastModified);
if(!FIXED_START&&(!(S>0)||Math.abs(Date.now()-S)<3000)){ /* сервер не отдал дату файла: запоминаем первый заход в этом браузере */
 try{S=+localStorage.getItem("dgl_start")||0;if(!S){S=Date.now();localStorage.setItem("dgl_start",S)}}catch(e){S=Date.now()}}
const START=S,END=START+20*864e5;
const t=document.getElementById("t"),b=document.getElementById("b");
const u=(n,l,c)=>`<div class="u ${c||""}"><b>${String(n).padStart(2,"0")}</b><span>${l}</span></div>`;
function tick(){
 const now=Date.now(),left=Math.max(0,END-now),s=Math.ceil(left/1000);
 if(left<=0){t.innerHTML='<div class="done">Время вышло</div>';b.style.width="100%";return false}
 t.innerHTML=u(s/86400|0,"дней")+u(s%86400/3600|0,"часов")+u(s%3600/60|0,"минут")+u(s%60,"секунд","s");
 b.style.width=Math.min(100,(now-START)/(END-START)*100)+"%";
 document.title=`${s/86400|0}д ${String(s%86400/3600|0).padStart(2,"0")}:${String(s%3600/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
 return true}
(function loop(){if(tick())setTimeout(loop,1000-Date.now()%1000+5)})();
</script>
